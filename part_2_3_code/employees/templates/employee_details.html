{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Detials</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <h1>Employee Records - {{ employee.full_name }}</h1>
    <img
      src="{{ employee.image.url}}"
      alt="{{employee.first_name}}"
      style="
        width: 200px;
        margin-left: auto;
        margin-right: auto;
        max-width: 100%;
        display: block;
      "
    />
    <h3>Email: {{ employee.email }}</h3>
    <h3>Designation: {{ employee.designation }}</h3>
  </body>
</html>
